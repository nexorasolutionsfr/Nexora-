# n8n hébergé pour Nexora — un seul consommateur actif, données persistantes, HTTPS automatique.
#
# Pourquoi Postgres et plus SQLite : la base SQLite du Mac a déjà été corrompue une fois
# (sauvegardes « corrupt » d'août dans ~/Nexora). Postgres supporte les arrêts brutaux et
# se sauvegarde à chaud avec pg_dump.
# Pourquoi Caddy : HTTPS Let's Encrypt sans rien configurer, une ligne par domaine.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets: [postgres_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.37.7  # même version que l’instance du Mac (10 sept. 2026)
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/postgres_password
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${N8N_HOST}/
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 20000
    volumes:
      - n8n_data:/home/node/.n8n
    secrets: [n8n_encryption_key, postgres_password]
    expose: ["5678"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      N8N_HOST: ${N8N_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [n8n]

secrets:
  n8n_encryption_key:
    file: ./secrets/n8n_encryption_key
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
